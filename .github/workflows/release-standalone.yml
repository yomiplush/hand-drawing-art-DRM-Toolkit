name: Release Standalone Edition

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-standalone:
    name: Build Portable Linux & Windows Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install dependencies & verify checks
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Build portable standalone archives & SHA256SUMS.txt
        run: bash scripts/build-standalone.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: certified-handmade-standalone
          path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
