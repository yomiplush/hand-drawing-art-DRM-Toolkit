name: Release Standalone Edition

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-standalone:
    name: Build Portable Linux, Windows & macOS Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install dependencies & verify checks
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm run lint
          npm test

      - name: Build portable standalone archives & SHA256SUMS.txt
        env:
          CHM_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash scripts/build-standalone.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: certified-handmade-standalone
          path: |
            release/certified-handmade-linux-amd64
            release/certified-handmade-windows-amd64.exe
            release/certified-handmade-darwin-arm64
            release/certified-handmade-darwin-amd64
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt

  verify-platforms:
    name: Verify Standalone Binary (${{ matrix.os }})
    needs: build-standalone
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          name: certified-handmade-standalone
          path: release

      - name: Verify Linux binary & loopback server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          chmod +x certified-handmade-linux-amd64
          ./certified-handmade-linux-amd64 --version
          ./certified-handmade-linux-amd64 --no-browser --port=43888 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:43888/ | grep -qi "Certified Handmade"; then
              echo "Linux loopback server verified!"
              exit 0
            fi
            sleep 0.5
          done
          echo "Linux loopback server failed to respond" >&2
          exit 1

      - name: Verify macOS binary & loopback server
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS.txt
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            BIN="./certified-handmade-darwin-arm64"
          else
            BIN="./certified-handmade-darwin-amd64"
          fi
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --no-browser --port=43888 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:43888/ | grep -qi "Certified Handmade"; then
              echo "macOS ($ARCH) loopback server verified!"
              exit 0
            fi
            sleep 0.5
          done
          echo "macOS loopback server failed to respond" >&2
          exit 1

      - name: Verify Windows binary & loopback server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location release
          .\certified-handmade-windows-amd64.exe --version
          $proc = Start-Process -FilePath ".\certified-handmade-windows-amd64.exe" -ArgumentList "--no-browser","--port=43888" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:43888/" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200 -and $resp.Content -match "Certified Handmade") {
                  Write-Host "Windows loopback server verified!"
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) {
              throw "Windows loopback server failed to respond"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

  publish-release:
    name: Publish GitHub Release
    needs: [build-standalone, verify-platforms]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified standalone artifacts
        uses: actions/download-artifact@v4
        with:
          name: certified-handmade-standalone
          path: release

      - name: Publish GitHub Release on tag push
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/certified-handmade-linux-amd64
            release/certified-handmade-windows-amd64.exe
            release/certified-handmade-darwin-arm64
            release/certified-handmade-darwin-amd64
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
