name: Bug Report
description: Report a bug in Certified Handmade (Web/PWA, Standalone, or CLI)
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please do **not** attach private keys (`.chkey.json`), passphrases, or sensitive personal files.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Web / PWA (certified-handmade.com)
        - Portable Standalone (Linux / Windows / macOS)
        - Independent CLI (Node.js / Go)
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity Mode
      options:
        - Online
        - Offline (PWA cached / Airplane mode / Standalone)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & Operating System
      placeholder: 'e.g., Chrome 131 on Linux x86_64, Safari on iPadOS 18'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '/create'
        2. Select a working file...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
